[package]
name = "chrono-distribution-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-11-22-0344"
shlex = "=2.0.1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
chrono-distribution = { path = "../distribution" }


[[bin]]
name = "chrono-distribution-test-cli"
path = "../distribution/src/main.rs"
test = false
bench = false

[[test]]
name = "installation"
path = "tests/installation.rs"

[[bin]]
name = "distribution-transport-fixture"
path = "tests/support/transport.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "tests/support/git.rs"
test = false
bench = false

[[test]]
name = "asset_identity"
path = "tests/asset_identity.rs"
