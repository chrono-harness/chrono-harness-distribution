[package]
name = "chrono-distribution-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-identifiers = { git = "https://github.com/chrono-harness/chrono-harness-identifiers.git", rev = "77f5059bac12d38630ab42a3b6f4ba4222fd7464" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
shlex = "=2.0.1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
chrono-distribution = { path = "../distribution" }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }


[[bin]]
name = "chrono-distribution-test-cli"
path = "../distribution/src/main.rs"
test = false
bench = false

[[test]]
name = "installation"
path = "tests/installation.rs"

[[bin]]
name = "distribution-transport-fixture"
path = "tests/support/transport.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "tests/support/git.rs"
test = false
bench = false
