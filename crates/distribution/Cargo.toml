[package]
name = "chrono-distribution"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit binary release packaging and pinned host installation"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-distribution"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
