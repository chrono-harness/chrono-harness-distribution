[package]
name = "chrono-distribution"
version = "0.1.6"
edition = "2024"
publish = false
description = "Explicit binary release packaging and pinned host installation"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-distribution"
path = "src/main.rs"
test = false
bench = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-11-22-0344"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["std", "macros"] }
digest-io = "0.1"
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
rustix = "1"

[profile.dev.package.sha2]
opt-level = 3
